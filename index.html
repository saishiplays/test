<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Jump Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- NAME INPUT SCREEN -->
  <div id="nameScreen">
    <div class="box">
      <h2>Enter Your Name</h2>
      <input id="playerNameInput" maxlength="12" placeholder="Player name" />
      <button id="startBtn">Start</button>
    </div>
  </div>

  <!-- GAME CANVAS -->
  <canvas id="game" width="400" height="600"></canvas>

  <!-- Firebase Scripts (load first!) -->
  <script src="https://www.gstatic.com/firebasejs/10.15.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.15.0/firebase-database-compat.js"></script>

  <!-- Your Game -->
  <script src="game.js"></script>
</body>
</html>
