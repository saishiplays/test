<!-- LOADING SCREEN -->
<div id="loadingScreen">
  <h2>Loading Game...</h2>
</div>

<!-- NAME SCREEN -->
<div id="nameScreen">
  <div class="box">
    <h2>Enter Your Name</h2>
    <input id="playerNameInput" maxlength="12" placeholder="Player name" />
    <button id="startBtn">Start</button>
  </div>
</div>

<!-- GAME CANVAS -->
<canvas id="game" width="400" height="600"></canvas>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.15.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.15.0/firebase-database-compat.js"></script>

<!-- GAME JS -->
<script src="game.js"></script>
